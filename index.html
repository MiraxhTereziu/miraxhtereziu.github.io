<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miraxh Tereziu Photography</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
</head>

<body>
  <header>
    <div class="sidebar-top">
      <img src="logo.svg" alt="Miraxh Tereziu Logo" class="sidebar-logo" />
      <h1>Miraxh Tereziu</h1>
      <p class="tagline">Amateur photographer from Italy, just having fun trying to improve every shot I take.</p>
    </div>
    <div class="sidebar-footer">
      <p>All images are free to use without copyright. This website does not collect cookies.</p>
    </div>
  </header>

  <main class="gallery-section">
    <div class="gallery-grid" id="galleryGrid"></div>
  </main>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-content" id="lightboxContent">
      <div class="image-wrapper" id="imageWrapper">
        <img id="lightboxThumb" src="" alt="">
        <img id="lightboxImg" src="" alt="">
      </div>
      <div class="lightbox-actions" id="lightboxActions">
        <div class="action-btn-wrapper">
          <div id="infoPopup" class="info-popup"></div>
          <button id="infoBtn" class="action-btn" aria-label="Image Info">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a96,96,0,1,1-96-96A96,96,0,0,1,224,128Z" opacity="0.2"/><path d="M144,176a8,8,0,0,1-8,8,16,16,0,0,1-16-16V128a8,8,0,0,1,0-16,16,16,0,0,1,16,16v40A8,8,0,0,1,144,176Zm88-48A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128ZM124,96a12,12,0,1,0-12-12A12,12,0,0,0,124,96Z"/></svg>
          </button>
        </div>
        <a id="downloadBtn" class="action-btn" download aria-label="Download Image">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M216,48V208H40V48A16,16,0,0,1,56,32H200A16,16,0,0,1,216,48Z" opacity="0.2"/><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z"/></svg>
        </a>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
